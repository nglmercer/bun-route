<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO + bun-route Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f23; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a3e; padding: 16px 24px; border-bottom: 1px solid #2a2a5e; }
    header h1 { font-size: 18px; color: #7c7cf0; }
    header span { font-size: 13px; color: #888; margin-left: 12px; }
    #status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-left: 12px; }
    #status.connected { background: #4caf50; }
    #status.disconnected { background: #f44336; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
    .msg.me { background: #2a2a6e; align-self: flex-end; }
    .msg.other { background: #2a2a3e; align-self: flex-start; }
    .msg.system { background: transparent; align-self: center; font-size: 12px; color: #888; font-style: italic; }
    .msg .author { font-size: 11px; color: #7c7cf0; margin-bottom: 4px; }
    .msg .time { font-size: 10px; color: #666; text-align: right; margin-top: 4px; }
    #online { font-size: 12px; color: #888; padding: 0 24px 8px; }
    #typing { font-size: 12px; color: #888; padding: 0 24px 8px; height: 20px; }
    #input-area { display: flex; padding: 12px 24px; gap: 8px; border-top: 1px solid #2a2a5e; background: #1a1a3e; }
    #message-input { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid #3a3a6e; background: #0f0f23; color: #e0e0e0; font-size: 14px; outline: none; }
    #message-input:focus { border-color: #7c7cf0; }
    button { padding: 10px 20px; border-radius: 8px; border: none; background: #7c7cf0; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #6a6ad8; }
    #login-overlay { position: fixed; inset: 0; background: rgba(15,15,35,0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #login-card { background: #1a1a3e; padding: 32px; border-radius: 12px; text-align: center; border: 1px solid #2a2a5e; }
    #login-card h2 { margin-bottom: 16px; color: #7c7cf0; }
    #login-card input { padding: 10px 16px; border-radius: 8px; border: 1px solid #3a3a6e; background: #0f0f23; color: #e0e0e0; font-size: 14px; width: 200px; margin-bottom: 12px; outline: none; }
    #login-card input:focus { border-color: #7c7cf0; }
    #login-card button { width: 100%; }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div id="login-card">
      <h2>Join Chat</h2>
      <input id="username-input" type="text" placeholder="Enter your name" maxlength="20" autofocus>
      <br>
      <button onclick="joinChat()">Join</button>
    </div>
  </div>

  <header>
    <h1>Socket.IO Chat <span id="room-label">#general</span><span id="status" class="disconnected"></span></h1>
  </header>
  <div id="online">👤 Online: <span id="online-count">0</span></div>
  <div id="messages"></div>
  <div id="typing"></div>
  <div id="input-area">
    <input id="message-input" type="text" placeholder="Type a message..." disabled>
    <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    let socket = null;
    let username = '';

    function joinChat() {
      const input = document.getElementById('username-input');
      username = input.value.trim();
      if (!username) return;

      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('message-input').focus();

      connectSocket();
    }

    function connectSocket() {
      socket = io({ path: '/socket.io', transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        document.getElementById('status').className = 'connected';
        socket.emit('chat:join', username);
      });

      socket.on('disconnect', () => {
        document.getElementById('status').className = 'disconnected';
      });

      socket.on('chat:message', (msg) => {
        addMessage(msg.username, msg.text, msg.username === username ? 'me' : 'other', msg.timestamp);
      });

      socket.on('chat:system', (msg) => {
        document.getElementById('online-count').textContent = msg.online;
        if (msg.type === 'join') {
          addMessage('System', `${msg.username} joined the chat`, 'system');
        } else if (msg.type === 'leave') {
          addMessage('System', `${msg.username} left the chat`, 'system');
        }
      });

      socket.on('chat:history', (messages) => {
        messages.forEach(m => addMessage(m.username, m.text, 'system', m.timestamp));
      });

      socket.on('chat:typing', (data) => {
        const el = document.getElementById('typing');
        if (data.isTyping && data.username !== username) {
          el.textContent = `${data.username} is typing...`;
        } else {
          el.textContent = '';
        }
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !socket) return;
      socket.emit('chat:message', text);
      input.value = '';
      input.focus();
      socket.emit('chat:typing', false);
    }

    function addMessage(author, text, type, timestamp) {
      const el = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      if (type !== 'system') {
        const authorEl = document.createElement('div');
        authorEl.className = 'author';
        authorEl.textContent = author;
        div.appendChild(authorEl);
      }
      const textEl = document.createElement('div');
      textEl.textContent = text;
      div.appendChild(textEl);
      if (timestamp) {
        const timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.textContent = new Date(timestamp).toLocaleTimeString();
        div.appendChild(timeEl);
      }
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('username-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    let typingTimer = null;
    document.getElementById('message-input').addEventListener('input', () => {
      if (!socket) return;
      socket.emit('chat:typing', true);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('chat:typing', false);
      }, 1000);
    });
  </script>
</body>
</html>
